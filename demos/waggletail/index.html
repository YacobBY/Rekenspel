<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Kwispelsteeg &ndash; Dierenopvang</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="logo">🐾 Kwispelsteeg</div>
    <div class="badges">
      <div class="badge" id="dayBadge" title="Dag">📅 Dag <b id="dayNum">1</b></div>
      <div class="badge" id="foodBadge" title="Brokken">🥣 <b id="scoopNum">20</b></div>
      <button class="badge tap" id="lettersBtn" type="button">💌 <b id="letterNum">0</b></button>
    </div>
  </header>

  <div class="phasebar" id="phasebar">
    <span class="pip" data-p="morning">☀️ Ochtend</span>
    <span class="pip" data-p="middag">🕑 Middag</span>
    <span class="pip" data-p="avond">🌙 Avond</span>
  </div>

  <div class="stagewrap">
    <!-- het diorama: één isometrische tuin waar de dieren in wonen -->
    <div class="world uit" id="world" role="img"
         aria-label="De tuin van de Kwispelsteeg met de dieren erin">
      <canvas id="worldCv"></canvas>
      <div class="tags" id="worldTags"></div>
    </div>
    <main id="scene" class="scene"></main>
  </div>

  <footer class="foot">Kwispelsteeg &middot; demo &middot; rustig aan, je mag alles zo vaak proberen als je wil</footer>
</div>

<div id="overlay" class="overlay hidden" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="art.js"></script>
<script src="world.js"></script>
<script src="state.js"></script>
<script src="ui.js"></script>
<script src="game.js"></script>
</body>
</html>
