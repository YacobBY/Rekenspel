<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Dierenhotel Kwispelsteeg</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="logo">🛎️ Dierenhotel</div>
    <div class="badges">
      <div class="badge" id="dayBadge" title="Dag">📅 Dag <b id="dayNum">1</b></div>
      <button class="badge tap" id="muntBadge" type="button" title="De kassa">💰 <b id="muntNum">0</b></button>
      <div class="badge" id="sterBadge" title="Sterren">⭐ <b id="sterNum">0</b></div>
      <button class="badge tap" id="lettersBtn" type="button">💌 <b id="letterNum">0</b></button>
      <button class="badge tap" id="sndBtn" type="button" title="Geluid" aria-label="Geluid aan of uit">🔊</button>
    </div>
  </header>

  <div class="rondebalk">
    <span class="ronde" id="rondeNaam">☀️ Ochtendronde</span>
    <button class="btn mini2" id="prikBtn" type="button">📋 Prikbord</button>
    <button class="btn mini2" id="avondBtn" type="button">🌙 Avond</button>
  </div>

  <div class="stagewrap">
    <div class="stagecol">
      <!-- de kamer waar je nu staat: één ruimte vult altijd het kader -->
      <div class="world" id="world" role="img"
           aria-label="De ruimte van het dierenhotel waar je nu staat">
        <canvas id="worldCv"></canvas>
        <div class="tags" id="worldTags"></div>
        <!-- de hotspot-laag: knoppen en sleep-doelen op de voorwerpen zelf -->
        <div class="hits" id="worldHits"></div>
      </div>
      <nav class="kamerbalk" id="kamerbalk" aria-label="Naar een andere ruimte"></nav>
    </div>
    <main id="scene" class="scene"></main>
  </div>

  <footer class="foot">Dierenhotel Kwispelsteeg &middot; demo &middot; rustig aan, je mag alles zo vaak proberen als je wil</footer>
</div>

<div id="overlay" class="overlay hidden" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="art.js"></script>
<script src="rooms.js"></script>
<script src="hits.js"></script>
<script src="world.js"></script>
<script src="snd.js"></script>
<script src="ui.js"></script>
<script src="state.js"></script>
<script src="econ.js"></script>
<script src="games/registry.js"></script>
<script src="hotel.js"></script>
<!-- de minigames: elk bestand meldt zichzelf aan bij de stekkerdoos.
     Wie een spel bouwt raakt ALLEEN zijn eigen bestand aan. -->
<script src="games/voerkar.js"></script>
<script src="games/bedden.js"></script>
<script src="games/sleutels.js"></script>
<script src="games/tobbe.js"></script>
<script src="games/meubels.js"></script>
<script src="game.js"></script>
</body>
</html>
