  <rect x="8" y="8" width="112" height="112" rx="24" fill="#FFB88C"/>
  <rect x="8" y="76" width="112" height="44" fill="#F2915B"/>
  <path d="M8 76h112v20a24 24 0 0 1-24 24H32a24 24 0 0 1-24-24z" fill="#F2915B"/>
  <!-- the bell -->
  <path d="M64 34c-19 0-34 15-34 34v10h68V68c0-19-15-34-34-34z" fill="#FFFDF8"/>
  <rect x="22" y="78" width="84" height="12" rx="6" fill="#FFFDF8"/>
  <rect x="22" y="86" width="84" height="5" rx="2.5" fill="#EAE0C8"/>
  <circle cx="64" cy="27" r="8" fill="#F2C14E"/>
  <!-- one paw print on the dome: the hotel is for animals -->
  <ellipse cx="64" cy="64" rx="10" ry="8.5" fill="#8A7566"/>
