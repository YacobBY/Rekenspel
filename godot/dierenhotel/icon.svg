<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Dierenhotel Kwispelsteeg — the reception bell and one paw print.
       Flat, warm and legible down to 32 px; palette from art-sound-rules.md §2.4. -->
